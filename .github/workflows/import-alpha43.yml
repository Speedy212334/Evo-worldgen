name: Import verified Alpha 4.3 source

on:
  push:
    branches: [main]
    paths:
      - "EvolutionWorldGen-26.3-Alpha4.3-Locate-Compatibility-Source.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify and unpack the exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="EvolutionWorldGen-26.3-Alpha4.3-Locate-Compatibility-Source.zip"
          expected="a4c6511f2317337d16c0bb1497e49fa3e1143ed5c1b6f23728930f0685b13392"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The uploaded archive does not match the verified Alpha4.3 source snapshot."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path("EvolutionWorldGen-26.3-Alpha4.3-Locate-Compatibility-Source.zip")
          prefix = "EvolutionWorldGen-Alpha4-Source/"
          repo = Path(".").resolve()

          with zipfile.ZipFile(archive) as zf:
              members = [m for m in zf.infolist() if m.filename.startswith(prefix)]
              if not members:
                  raise SystemExit("Expected source folder was not found inside the ZIP.")

              for member in members:
                  name = PurePosixPath(member.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")

                  relative = name.relative_to(PurePosixPath(prefix.rstrip("/")))
                  if not relative.parts:
                      continue
                  if relative.parts[0] in {".git", ".github"}:
                      continue

                  destination = (repo / Path(*relative.parts)).resolve()
                  if repo not in destination.parents and destination != repo:
                      raise SystemExit(f"ZIP entry escapes repository: {member.filename}")

                  if member.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(member) as source, destination.open("wb") as target:
                          target.write(source.read())

          archive.unlink()
          PY

          mkdir -p docs
          cat > docs/GITHUB-SOURCE-IMPORT.md <<'EOF'
          # GitHub source import record

          Imported baseline: EvolutionWorldGen 26.3 Alpha 4.3
          Source archive SHA-256: a4c6511f2317337d16c0bb1497e49fa3e1143ed5c1b6f23728930f0685b13392

          Alpha4.3 includes the compact natural Evolution Nexus spawn platform and
          vanilla locate compatibility for both fixed-origin structures. Static
          audits passed in the preparation environment. A Java 25 Gradle build and
          live Minecraft 26.3 locate tests remain required.
          EOF

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import EvolutionWorldGen Alpha 4.3 locate compatibility"
          git push origin HEAD:main
