name: Import verified Alpha 4.5 source

on:
  push:
    branches: [main]
    paths:
      - "EvolutionWorldGen-26.3-Alpha4.5-Vanilla-Locate-Preflight-Source.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify and unpack the exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="EvolutionWorldGen-26.3-Alpha4.5-Vanilla-Locate-Preflight-Source.zip"
          expected="bff03ed453e9a91866dc1e1f939d148169a962f70796f491032dbe9f4f89ce1e"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The uploaded archive does not match the verified Alpha4.5 source snapshot."
            exit 1
          fi

          # Replace the previous source tree while keeping repository metadata,
          # workflow definitions, and the archive being verified.
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          keep = {".git", ".github", "EvolutionWorldGen-26.3-Alpha4.5-Vanilla-Locate-Preflight-Source.zip"}
          for path in Path(".").iterdir():
              if path.name in keep:
                  continue
              if path.is_dir():
                  shutil.rmtree(path)
              else:
                  path.unlink()
          PY

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path("EvolutionWorldGen-26.3-Alpha4.5-Vanilla-Locate-Preflight-Source.zip")
          prefix = "EvolutionWorldGen-Alpha4-Source/"
          repo = Path(".").resolve()

          with zipfile.ZipFile(archive) as zf:
              members = [m for m in zf.infolist() if m.filename.startswith(prefix)]
              if not members:
                  raise SystemExit("Expected source folder was not found inside the ZIP.")

              for member in members:
                  name = PurePosixPath(member.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")

                  relative = name.relative_to(PurePosixPath(prefix.rstrip("/")))
                  if not relative.parts or relative.parts[0] in {".git", ".github"}:
                      continue

                  destination = (repo / Path(*relative.parts)).resolve()
                  if repo not in destination.parents and destination != repo:
                      raise SystemExit(f"ZIP entry escapes repository: {member.filename}")

                  if member.is_dir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(member) as source, destination.open("wb") as target:
                          target.write(source.read())

          archive.unlink()
          PY

          mkdir -p docs
          cat > docs/GITHUB-SOURCE-IMPORT.md <<'EOF'
          # GitHub source import record

          Imported baseline: EvolutionWorldGen 26.3 Alpha 4.5
          Source archive SHA-256: bff03ed453e9a91866dc1e1f939d148169a962f70796f491032dbe9f4f89ce1e

          Alpha4.5 retains all 41 original structure NBT builds and adds the
          StructureCheck locator-preflight parity fix for fixed-origin and bounded
          random-spread structures. Static audits passed in the preparation
          environment. A Java 25 Gradle build and live Minecraft 26.3 registry,
          generation and /locate tests remain required.
          EOF

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import EvolutionWorldGen Alpha 4.5 vanilla locate preflight"
          git push origin HEAD:main
